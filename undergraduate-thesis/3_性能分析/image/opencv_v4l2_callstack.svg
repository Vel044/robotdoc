<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenCV to V4L2 call path</title>
  <desc id="desc">Aligned layered call path from LeRobot camera read through OpenCV, glibc syscall and Linux V4L2 kernel queues.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#536DFF"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C8FA3"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF8A3D"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E9A2F"/>
    </marker>
    <style>
      .layer {
        fill: #8b8b8b;
        font-family: "Songti SC", "Noto Serif CJK SC", "PingFang SC", serif;
        font-size: 28px;
        font-weight: 700;
      }
      .box-text {
        fill: #111111;
        font-family: "Songti SC", "Noto Serif CJK SC", "PingFang SC", serif;
        font-size: 25px;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .code {
        font-family: "Menlo", "Consolas", "Courier New", monospace;
      }
      .note {
        fill: #9a9a9a;
        font-family: "Songti SC", "Noto Serif CJK SC", "PingFang SC", serif;
        font-size: 23px;
      }
      .node-blue {
        fill: #EEEEFF;
        stroke: #7070FF;
        stroke-width: 2.2;
      }
      .node-cyan {
        fill: #E8F8FC;
        stroke: #2293AD;
        stroke-width: 2.2;
      }
      .node-orange {
        fill: #FFF1E6;
        stroke: #FF8A3D;
        stroke-width: 2.2;
      }
      .node-green {
        fill: #EFFFF0;
        stroke: #1E9A2F;
        stroke-width: 2.2;
      }
      .divider {
        stroke: #D5D5D5;
        stroke-width: 1.6;
        stroke-dasharray: 8 8;
      }
      .blue-line {
        stroke: #536DFF;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow-blue);
      }
      .cyan-line {
        stroke: #2C8FA3;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow-cyan);
      }
      .orange-line {
        stroke: #FF8A3D;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow-orange);
      }
      .green-line {
        stroke: #1E9A2F;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow-green);
      }
    </style>
  </defs>

  <rect width="1080" height="760" fill="#ffffff"/>

  <line class="divider" x1="210" y1="132" x2="1010" y2="132"/>
  <line class="divider" x1="210" y1="258" x2="1010" y2="258"/>
  <line class="divider" x1="210" y1="508" x2="1010" y2="508"/>

  <text class="layer" x="70" y="70">LeRobot</text>
  <text class="layer" x="70" y="195">OpenCV</text>
  <text class="layer" x="40" y="383">glibc / syscall</text>
  <text class="layer" x="40" y="633">Linux kernel</text>

  <rect class="node-blue" x="215" y="41" width="170" height="58" rx="8"/>
  <text class="box-text" x="300" y="70">后台读线程</text>

  <rect class="node-blue" x="415" y="41" width="170" height="58" rx="8"/>
  <text class="box-text" x="500" y="70">相机<tspan class="code"> read</tspan></text>

  <rect class="node-cyan" x="415" y="163" width="170" height="64" rx="7"/>
  <text class="box-text code" x="500" y="187">VideoCapture</text>
  <text class="box-text" x="500" y="213">read</text>

  <rect class="node-cyan" x="615" y="163" width="170" height="64" rx="7"/>
  <text class="box-text code" x="700" y="187">grab</text>
  <text class="box-text" x="700" y="213">尝试 ioctl</text>

  <rect class="node-cyan" x="815" y="163" width="170" height="64" rx="7"/>
  <text class="box-text code" x="900" y="187">retrieve</text>
  <text class="box-text" x="900" y="213">MJPEG 解码</text>

  <rect class="node-orange" x="415" y="288" width="170" height="64" rx="7"/>
  <text class="box-text code" x="500" y="312">select</text>
  <text class="box-text" x="500" y="338">等待 fd 可读</text>

  <rect class="node-orange" x="615" y="288" width="170" height="64" rx="7"/>
  <text class="box-text code" x="700" y="312">ioctl</text>
  <text class="box-text code" x="700" y="338">VIDIOC_DQBUF</text>

  <rect class="node-orange" x="415" y="413" width="170" height="64" rx="7"/>
  <text class="box-text code" x="500" y="437">pselect6</text>
  <text class="box-text" x="500" y="463">睡眠等待</text>

  <rect class="node-green" x="415" y="538" width="170" height="64" rx="7"/>
  <text class="box-text code" x="500" y="562">V4L2 / UVC</text>
  <text class="box-text" x="500" y="588">设备驱动</text>

  <rect class="node-green" x="615" y="538" width="170" height="64" rx="7"/>
  <text class="box-text code" x="700" y="562">videobuf2</text>
  <text class="box-text" x="700" y="588">完成队列</text>

  <rect class="node-green" x="415" y="666" width="170" height="62" rx="7"/>
  <text class="box-text code" x="500" y="690">done_wq</text>
  <text class="box-text" x="500" y="714">等待队列</text>

  <path class="blue-line" d="M 385 70 L 407 70"/>
  <path class="blue-line" d="M 500 99 L 500 155"/>

  <path class="cyan-line" d="M 585 195 L 607 195"/>
  <path class="cyan-line" d="M 785 195 L 807 195"/>

  <path class="orange-line" d="M 660 227 L 545 288"/>
  <text class="note" x="300" y="276">EAGAIN 时调用 select</text>

  <path class="green-line" d="M 700 227 L 700 280"/>
  <text class="note" x="715" y="276">已有完成帧</text>

  <path class="orange-line" d="M 500 352 L 500 405"/>
  <path class="orange-line" d="M 500 477 L 500 530"/>
  <path class="orange-line" d="M 500 602 L 500 658"/>

  <path class="green-line" d="M 700 352 L 700 530"/>

  <text class="note" x="830" y="500">系统调用边界</text>
  <text class="note" x="515" y="648">新帧完成</text>
  <text class="note" x="415" y="744">唤醒后重试 ioctl</text>
</svg>
