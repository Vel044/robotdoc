<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <style>
      .title { font: 700 34px "Songti SC", "Noto Serif CJK SC", serif; fill: #1f2933; }
      .small { font: 22px "Songti SC", "Noto Serif CJK SC", serif; fill: #52616b; }
      .code { font: 700 27px "Menlo", "Consolas", monospace; fill: #17212b; }
      .method { font: 23px "Menlo", "Consolas", monospace; fill: #24313b; }
      .box { fill: #ffffff; stroke: #7f95a5; stroke-width: 2.5; rx: 14; }
      .main { fill: #eef7ff; stroke: #2378b9; stroke-width: 3; rx: 14; }
      .base { fill: #f6f8fa; stroke: #8a9aa8; stroke-width: 2.5; rx: 14; }
      .sdk { fill: #fff7ed; stroke: #d97706; stroke-width: 3; rx: 14; }
      .line { stroke: #d0dae2; stroke-width: 2; }
      .legend { font: 20px "Songti SC", "Noto Serif CJK SC", serif; fill: #52616b; }
      .call { stroke: #1f78bd; stroke-width: 3.2; fill: none; marker-end: url(#arrow); }
      .inherit { stroke: #52616b; stroke-width: 2.8; fill: none; marker-end: url(#tri); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#1f78bd"/>
    </marker>
    <marker id="tri" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M 0 1 L 12 6.5 L 0 12 z" fill="#ffffff" stroke="#52616b" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="1600" height="620" fill="#ffffff"/>
  <text x="800" y="62" text-anchor="middle" class="title">LeRobot 执行阶段关键架构</text>

  <!-- Legend -->
  <line x1="565" y1="96" x2="625" y2="96" class="call"/>
  <text x="640" y="103" class="legend">调用关系</text>
  <line x1="795" y1="96" x2="855" y2="96" class="inherit"/>
  <text x="870" y="103" class="legend">继承关系</text>

  <!-- Base classes -->
  <rect x="453" y="130" width="270" height="96" class="base"/>
  <text x="588" y="169" text-anchor="middle" class="code">Robot</text>
  <line x1="478" y1="185" x2="698" y2="185" class="line"/>
  <text x="588" y="210" text-anchor="middle" class="small">机器人基类</text>

  <rect x="842" y="130" width="300" height="96" class="base"/>
  <text x="992" y="169" text-anchor="middle" class="code">MotorsBus</text>
  <line x1="867" y1="185" x2="1117" y2="185" class="line"/>
  <text x="992" y="210" text-anchor="middle" class="small">电机总线基类</text>

  <!-- Main call path -->
  <rect x="64" y="330" width="300" height="135" class="box"/>
  <text x="214" y="373" text-anchor="middle" class="code">record.py</text>
  <line x1="94" y1="392" x2="334" y2="392" class="line"/>
  <text x="214" y="429" text-anchor="middle" class="method">record_loop()</text>

  <rect x="428" y="330" width="320" height="135" class="main"/>
  <text x="588" y="373" text-anchor="middle" class="code">SO101Follower</text>
  <line x1="458" y1="392" x2="718" y2="392" class="line"/>
  <text x="588" y="429" text-anchor="middle" class="method">send_action()</text>

  <rect x="812" y="330" width="360" height="135" class="main"/>
  <text x="992" y="373" text-anchor="middle" class="code">FeetechMotorsBus</text>
  <line x1="842" y1="392" x2="1142" y2="392" class="line"/>
  <text x="992" y="429" text-anchor="middle" class="method">write()</text>

  <rect x="1236" y="330" width="300" height="135" class="sdk"/>
  <text x="1386" y="373" text-anchor="middle" class="code">scservo_sdk</text>
  <line x1="1266" y1="392" x2="1506" y2="392" class="line"/>
  <text x="1386" y="429" text-anchor="middle" class="small">SCS 舵机协议与串口</text>

  <!-- Calls -->
  <path d="M 364 398 L 428 398" class="call"/>

  <path d="M 748 398 L 812 398" class="call"/>

  <path d="M 1172 398 L 1236 398" class="call"/>

  <!-- Inheritance -->
  <path d="M 588 330 L 588 226" class="inherit"/>
  <path d="M 992 330 L 992 226" class="inherit"/>
</svg>
