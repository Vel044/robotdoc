<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360">
  <defs>
    <style>
      .frame { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.5; }
      .stage { fill: #f8fbff; stroke: #2563eb; stroke-width: 2.4; }
      .wait { fill: #fffaf2; stroke: #f97316; stroke-width: 2.4; }
      .async { fill: #f9fafb; stroke: #6b7280; stroke-width: 1.8; stroke-dasharray: 7 5; }
      .stage-cn { font: 700 34px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .stage-en { font: 500 24px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #4b5563; }
      .small-cn { font: 600 22px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #374151; }
      .small-en { font: 500 18px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #6b7280; }
      .label { font: 400 18px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #4b5563; }
      .arrow { stroke: #2563eb; stroke-width: 3.2; fill: none; stroke-linecap: round; }
      .loop { stroke: #64748b; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .async-line { stroke: #6b7280; stroke-width: 2.2; fill: none; stroke-dasharray: 7 5; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="frame" x="28" y="28" width="1024" height="304" rx="18"/>

  <rect class="stage" x="104" y="88" width="190" height="96" rx="10"/>
  <text class="stage-cn" x="199" y="128" text-anchor="middle">观测阶段</text>
  <text class="stage-en" x="199" y="164" text-anchor="middle">Observation</text>

  <rect class="stage" x="332" y="88" width="190" height="96" rx="10"/>
  <text class="stage-cn" x="427" y="128" text-anchor="middle">推理阶段</text>
  <text class="stage-en" x="427" y="164" text-anchor="middle">Inference</text>

  <rect class="stage" x="560" y="88" width="190" height="96" rx="10"/>
  <text class="stage-cn" x="655" y="128" text-anchor="middle">执行阶段</text>
  <text class="stage-en" x="655" y="164" text-anchor="middle">Execution</text>

  <rect class="wait" x="788" y="88" width="190" height="96" rx="10"/>
  <text class="stage-cn" x="883" y="128" text-anchor="middle">等待阶段</text>
  <text class="stage-en" x="883" y="164" text-anchor="middle">Wait</text>

  <path class="arrow" d="M 295 136 H 314"/>
  <path d="M 327 136 L 311 126 L 311 146 Z" fill="#2563eb"/>

  <path class="arrow" d="M 523 136 H 542"/>
  <path d="M 555 136 L 539 126 L 539 146 Z" fill="#2563eb"/>

  <path class="arrow" d="M 751 136 H 770"/>
  <path d="M 783 136 L 767 126 L 767 146 Z" fill="#2563eb"/>

  <path class="loop" d="M 883 88 V 58 H 199 V 78"/>
  <path d="M 199 90 L 188.5 74 L 209.5 74 Z" fill="#64748b"/>
  <rect x="455" y="42" width="170" height="25" rx="4" fill="#ffffff"/>
  <text class="label" x="540" y="61" text-anchor="middle">等待结束后进入下一帧</text>

  <rect class="async" x="74" y="230" width="250" height="64" rx="9"/>
  <text class="small-cn" x="199" y="256" text-anchor="middle">异步读摄像头线程</text>
  <text class="small-en" x="199" y="281" text-anchor="middle">Camera Prefetch Thread</text>

  <path class="async-line" d="M 199 184 V 217"/>
  <path d="M 199 230 L 188.5 214 L 209.5 214 Z" fill="#6b7280"/>
</svg>
