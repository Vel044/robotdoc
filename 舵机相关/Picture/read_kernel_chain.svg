<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="260" viewBox="0 0 1580 260" role="img" aria-labelledby="title desc">
  <title id="title">read syscall chain</title>
  <desc id="desc">Horizontal read syscall call path from glibc read to TTY copy_to_user.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <style>
      .node {
        fill: #ffffff;
        stroke: #111111;
        stroke-width: 2;
      }
      .node-alt {
        fill: #f4f4f4;
        stroke: #111111;
        stroke-width: 2;
      }
      .user-bg {
        fill: #eef5ff;
      }
      .kernel-bg {
        fill: #f7f7f7;
      }
      .hardware-bg {
        fill: #f3f3f3;
      }
      .label {
        fill: #111111;
        font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 21px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .sub {
        fill: #333333;
        font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        font-weight: 500;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .region {
        fill: #555555;
        font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 21px;
        font-weight: 600;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .arrow {
        stroke: #111111;
        stroke-width: 2.4;
        fill: none;
        marker-end: url(#arrow);
      }
      .boundary {
        stroke: #4a6f9f;
        stroke-width: 2;
        stroke-dasharray: 8 7;
      }
      .hw-boundary {
        stroke: #777777;
        stroke-width: 1.6;
        stroke-dasharray: 7 6;
      }
    </style>
  </defs>

  <rect width="1580" height="260" fill="#ffffff"/>
  <rect class="user-bg" x="18" y="42" width="208" height="168" rx="6"/>
  <rect class="kernel-bg" x="236" y="42" width="1326" height="168" rx="6"/>

  <text class="region" x="122" y="58">glibc / 用户态</text>
  <text class="region" x="899" y="58">kernel / 内核态</text>

  <rect class="node" x="35" y="76" width="170" height="104" rx="4"/>
  <text class="label" x="120" y="106">read()</text>
  <text class="sub" x="120" y="144">用户态调用入口</text>

  <line class="boundary" x1="231" y1="42" x2="231" y2="210"/>
  <line class="arrow" x1="205" y1="128" x2="250" y2="128"/>

  <rect class="node" x="250" y="76" width="165" height="104" rx="4"/>
  <text class="label" x="332.5" y="100">read() / VFS</text>
  <text class="sub" x="332.5" y="130">通用文件读入口</text>
  <text class="sub" x="332.5" y="152">分发到 TTY</text>

  <line class="arrow" x1="415" y1="128" x2="460" y2="128"/>

  <rect class="node" x="460" y="76" width="170" height="104" rx="4"/>
  <text class="label" x="545" y="100">tty_read()</text>
  <text class="sub" x="545" y="130">TTY 读入口</text>
  <text class="sub" x="545" y="152">进入 N_TTY</text>

  <line class="arrow" x1="630" y1="128" x2="675" y2="128"/>

  <rect class="node" x="675" y="76" width="170" height="104" rx="4"/>
  <text class="label" x="760" y="100">n_tty_read()</text>
  <text class="sub" x="760" y="130">消费 read_buf</text>
  <text class="sub" x="760" y="152">准备拷贝数据</text>

  <line class="arrow" x1="845" y1="128" x2="890" y2="128"/>

  <rect class="node" x="890" y="76" width="170" height="104" rx="4"/>
  <text class="label" x="975" y="96">
    <tspan x="975" dy="0">copy_from_</tspan>
    <tspan x="975" dy="24">read_buf()</tspan>
  </text>
  <text class="sub" x="975" y="152">read_buf -&gt; 内核缓冲</text>

  <line class="arrow" x1="1060" y1="128" x2="1105" y2="128"/>

  <rect class="node" x="1105" y="76" width="185" height="104" rx="4"/>
  <text class="label" x="1197.5" y="96">
    <tspan x="1197.5" dy="0">copy_to_</tspan>
    <tspan x="1197.5" dy="24">user()</tspan>
  </text>
  <text class="sub" x="1197.5" y="152">内核缓冲 -&gt; 用户态</text>
  <line class="arrow" x1="1290" y1="128" x2="1345" y2="128"/>

  <rect class="node-alt" x="1345" y="76" width="200" height="104" rx="4"/>
  <text class="label" x="1445" y="100">返回用户态</text>
  <text class="sub" x="1445" y="130">glibc / CPython</text>
  <text class="sub" x="1445" y="152">收到 bytes</text>
</svg>
