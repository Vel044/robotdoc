# QEMU -readconfig 配置文件。
# 这是第一阶段的 QEMU virt 环境，不是完整 Raspberry Pi 5 硬件模拟。

# QEMU 通用 ARM64 virt 机器；它会给 Linux 提供 QEMU 生成的 virt DTB。
[machine]
  type = "virt"

# 给 guest 4096 MiB 内存。
[memory]
  size = "4096"

# 给 guest 4 个虚拟 CPU。
[smp-opts]
  cpus = "4"

# SD 卡整盘 raw 镜像；先定义成后端，不直接接到 guest 总线。
[drive "hd0"]
  if = "none"
  file = "/home/vel/rpi-images/rpi_backup_20260416.img"
  format = "raw"

# 把 hd0 接成 virtio 块设备；guest 里通常是 /dev/vda。
[device "rootblk"]
  driver = "virtio-blk-device"
  drive = "hd0"

# 用户态 NAT 网络后端。
# guest 通常会拿到 10.0.2.x 地址，可访问外网。
# hostfwd 把宿主机 127.0.0.1:2222 转发到 guest:22，方便从宿主机 ssh 进 guest。
[netdev "net0"]
  type = "user"
  hostfwd = "tcp:127.0.0.1:2222-:22"

# virtio 网卡前端。
# 需要 guest kernel 支持 virtio-net；Raspberry Pi OS 里 NetworkManager/DHCP 会自动拿地址。
[device "net0"]
  driver = "virtio-net-device"
  netdev = "net0"
  mac = "52:54:00:12:34:56"

# QEMU 通用 xHCI USB host；这不是 Pi 5 的 RP1 DWC3 USB host。
# p2 是 USB2 端口数；键盘 + hub + 多个透传 USB 设备需要超过默认 4 个。
[device "xhci"]
  driver = "qemu-xhci"
  p2 = "8"
  p3 = "4"

# 第二个 QEMU xHCI USB host，专门放第二路 UVC。
# 在 Fusion -> Ubuntu VM -> QEMU 的嵌套透传里，双路 UVC 放在同一个虚拟 xHCI
# 有时会让第二路视频流 select() timeout；拆开控制器能减少 QEMU 内部调度互相影响。
[device "xhci_cam1"]
  driver = "qemu-xhci"
  p2 = "2"
  p3 = "1"

# USB HID 键盘，插到 xHCI port 1。
[device "kbd"]
  driver = "usb-kbd"
  bus = "xhci.0"
  port = "1"

# USB hub，插到 xHCI port 2。
# hub 下游端口用 port=2.1、2.2、2.3 这种路径指定。
[device "hub"]
  driver = "usb-hub"
  bus = "xhci.0"
  port = "2"

# 第一台真实 UVC camera 透传。
# hostport=4.1 是宿主机第一台原始 USB 2.0 Camera 所在物理路径。
# UVC 是 480M high-speed，不能挂到 QEMU full-speed hub 下游，所以直接挂 xHCI port 6。
[device "uvc-camera-0"]
  driver = "usb-host"
  hostbus = "1"
  hostport = "4.1"
  isobufs = "32"
  isobsize = "64"
  bus = "xhci.0"
  port = "6"

# 第二台真实 UVC camera 透传。
# hostport=4.2 是宿主机第二台原始 USB 2.0 Camera 所在物理路径。
# 挂到第二个 QEMU xHCI 控制器，guest 里通常会生成 /dev/video2 / /dev/video3。
[device "uvc-camera-1"]
  driver = "usb-host"
  hostbus = "1"
  hostport = "4.2"
  isobufs = "32"
  isobsize = "64"
  bus = "xhci_cam1.0"
  port = "1"

# 第一块真实 CDC ACM 串口板透传。
# hostport=3.1 是宿主机 VMware USB hub 下游第 1 口。
# guest 里挂到 QEMU hub 下游 port 3。
[device "cdc-acm-0"]
  driver = "usb-host"
  hostbus = "1"
  hostport = "3.1"
  bus = "xhci.0"
  port = "2.3"

# 第二块真实 CDC ACM 串口板透传。
# hostport=3.2 是宿主机 VMware USB hub 下游第 2 口。
# guest 里挂到 QEMU hub 下游 port 4。
[device "cdc-acm-1"]
  driver = "usb-host"
  hostbus = "1"
  hostport = "3.2"
  bus = "xhci.0"
  port = "2.4"
